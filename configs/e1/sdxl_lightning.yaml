# E1 SDXL-Lightning on the eval split: the two points frozen from the E2 tuning sweep
# (selection record: configs/e1/selection_sdxl_lightning.json). Each step count is a
# separate checkpoint, CFG 0.
#   quality point:     4-step checkpoint (highest tuning ImageReward within the CLIP tolerance)
#   lowest-step point: 2-step checkpoint (the 1-step x0 checkpoint is exploratory only)
experiment: e1
split: eval
seeds:
- 0
method: sdxl_lightning
resolution: 1024
dtype: fp16
models:
  stabilityai/stable-diffusion-xl-base-1.0: 462165984030d82259a11f4367a4eed129e94a7b
  ByteDance/SDXL-Lightning: c9a24f48e1c025556787b0c58dd67a091ece2e44
params:
  guidance_scale: 0.0
grid:
  lightning_steps:
  - 2
  - 4
